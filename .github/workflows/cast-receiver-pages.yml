name: Publish LocalFly Cast Receiver

on:
  push:
    branches: [audit-fix-2026-11]
    paths:
      - "receiver/**"
      - ".github/workflows/cast-receiver-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cast-receiver-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload receiver site
        uses: actions/upload-pages-artifact@v4
        with:
          path: receiver

      - name: Deploy receiver
        id: deployment
        uses: actions/deploy-pages@v4
